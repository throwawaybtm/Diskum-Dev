name: Deploy to Google Apps Script

on:
  push:
    branches:
      - main
    paths:
      - 'AWAN/**'
      - '.clasp.json'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install clasp
        run: npm install -g @google/clasp

      - name: Create clasprc credentials
        run: |
          echo "$CLASPRC_JSON" > ~/.clasprc.json
        env:
          CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}

      - name: Push code
        working-directory: ./AWAN
        run: clasp push --force

      - name: Deploy new version
        working-directory: ./AWAN
        run: |
          clasp version "Automated CI deploy: $(git rev-parse --short HEAD)"
          # Optional: deploy to specific deployment ID
          # clasp deploy -i ${{ secrets.DEPLOYMENT_ID }} -d "Commit: ${{ github.sha }}"
